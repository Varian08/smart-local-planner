# Production Configuration Profile
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

logging:
  level:
    root: INFO
    com.smartplanner: INFO
    org.springframework.web: WARN
