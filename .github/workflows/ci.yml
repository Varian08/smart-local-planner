name: Backend CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-build-check:
    name: Spring Boot 3 Compile & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      MAVEN_OPTS: "-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Sprint 1 Quality Gate: Compiles backend and executes all unit tests cleanly
      - name: Run Backend Unit Tests & Verify Quality Gate
        run: mvn -B clean test

