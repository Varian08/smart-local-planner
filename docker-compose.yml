services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_local_planner_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smart_local_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_local_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: smart_local_planner_postgres_data
